services:
  postgres:
    image: 'postgres:17'
    environment:
      POSTGRES_DB: erstorage
      POSTGRES_USER: erstorage
      POSTGRES_PASSWORD: erstorage
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rustfs:
    image: 'rustfs/rustfs:latest'
    environment:
      RUSTFS_VOLUMES: '/data'
      RUSTFS_ADDRESS: '0.0.0.0:9000'
      RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: erstorage
      RUSTFS_SECRET_KEY: erstorage-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs-data:/data

volumes:
  postgres-data:
  rustfs-data:
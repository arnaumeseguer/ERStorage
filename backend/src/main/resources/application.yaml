spring:
  application:
    name: ERStorage
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB

  web:
    locale: en
    locale-resolver: fixed

erstorage:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 24h
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:erstorage}
    secret-key: ${STORAGE_SECRET_KEY:erstorage-secret}
    bucket: ${STORAGE_BUCKET:erstorage}
    create-bucket-on-startup: ${STORAGE_CREATE_BUCKET:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  limits:
    registration-enabled: ${REGISTRATION_ENABLED:false}
    total-storage: ${TOTAL_STORAGE_LIMIT:8GB}
  demo:
    enabled: ${DEMO_ENABLED:false}
    lifetime: 1h
    quota: 20MB
    max-file-size: 5MB
    max-active-users: 30
    max-starts-per-ip-per-hour: 5

server:
  port: ${PORT:8080}
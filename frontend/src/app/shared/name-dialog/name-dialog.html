<dialog #dialog class="dialog" (keydown.escape)="onEscape($event)" (cancel)="onCancel($event)" (close)="cancelled.emit()">
  <form (submit)="submit($event)" novalidate>
    <h2>{{ heading() }}</h2>

    <label class="dialog-field">
      <span>{{ label() }}</span>
      <input
        #nameInput
        type="text"
        maxlength="255"
        autocomplete="off"
        [class.invalid]="emptyError()"
        (input)="emptyError.set(false)"
      />
    </label>
    @if (emptyError()) {
      <p class="field-error">Enter a name.</p>
    }

    @if (error()) {
      <p class="dialog-error" role="alert">{{ error() }}</p>
    }

    <div class="dialog-actions">
      <button type="button" class="btn-secondary" (click)="close()" [disabled]="busy()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="busy()">
        @if (busy()) {
          <span class="spinner" aria-hidden="true"></span>
        }
        {{ confirmLabel() }}
      </button>
    </div>
  </form>
</dialog>
